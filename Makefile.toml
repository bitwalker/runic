[config]
default_to_workspace = false
skip_core_tasks = true
skip_git_env_info = true
# For a virtual workspace, cargo-make 0.37.24 reads the crate information of the package in the
# subdirectory named like the root (`runic/`), which is parked and not a member: every task fails.
# No task uses the `CARGO_MAKE_CRATE_*` variables this skips.
skip_crate_env_info = true
modify_core_tasks = { private = true, namespace = "default" }
init_task = "init"

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
CARGO_MAKE_CARGO_VERBOSE_FLAGS = { source = "${CARGO_MAKE_CI}", default_value = "", mapping = { "true" = "--verbose" } }
CARGO_MAKE_RUST_SCRIPT_PROVIDER = "rust-script"
CARGO_MAKE_USE_WORKSPACE_PROFILE = true
CARGO_MAKE_CARGO_BUILD_TEST_FLAGS = "--no-fail-fast"
CARGO_TARGET_DIR = { value = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target", condition = { env_not_set = [
    "CARGO_TARGET_DIR",
] } }
BACKTRACE_DEFAULT = { source = "${CARGO_MAKE_CI}", mapping = { "true" = "1", "false" = "0" } }
RUST_BACKTRACE = { value = "${BACKTRACE_DEFAULT}", condition = { env_not_set = [
    "RUST_BACKTRACE",
] } }
RUNIC_BIN_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/bin"
RUNIC_INSTALL_DIR = "${RUNIC_BIN_DIR}/${CARGO_MAKE_RUST_TARGET_TRIPLE}"

[env.development]
RUNIC_BUILD_PROFILE = "debug"

[env.production]
RUNIC_BUILD_PROFILE = "release"

[tasks.init]
script = ['''
#!@duckscript

# Set an environment variable containing the current rustup toolchain
#
if is_path_exists "rust-toolchain.toml"
    toolchain_file = readfile "rust-toolchain.toml"
    channel_start = indexof ${toolchain_file} "channel = "
    if not is_empty ${channel_start}
        channel_quoted_start = calc ${channel_start} + 11
        rest_of_file = substring ${toolchain_file} ${channel_quoted_start}

        channel_end = indexof ${rest_of_file} "\""
        if not is_empty ${channel_end}
            channel = substring ${rest_of_file} 0 ${channel_end}
            channel = trim ${channel}
            set_env CARGO_MAKE_RUSTUP_TOOLCHAIN_NAME ${channel}
        end
    end
end

cm_run_task "print-env"
''']

[tasks.default]
category = "Build"
description = "Default task builds the compiler"
alias = "build"

[tasks.print-env]
category = "Tools"
run_task = [
    { name = [
        "print-build-env",
        "print-ci-env",
        "print-rust-env",
        "print-cargo-env",
    ] },
]

[tasks.print-build-env]
private = true
script = ['''
#!@duckscript
echo "*************************************"
echo "Build Environment:"
echo "    Task: ${CARGO_MAKE_TASK}"
echo "    Task Arguments: ${CARGO_MAKE_TASK_ARGS}"
echo "    Command: ${CARGO_MAKE_COMMAND}"
echo "    Working Directory: ${CARGO_MAKE_WORKING_DIRECTORY}"
echo "    Target Directory: ${CARGO_TARGET_DIR}"
echo "    Profile: ${CARGO_MAKE_PROFILE}"
echo "    Bin Directory: ${RUNIC_BIN_DIR}"
echo "    Install Directory: ${RUNIC_INSTALL_DIR}"
echo "    Target Triple: ${CARGO_MAKE_RUST_TARGET_TRIPLE}"
echo "    RUST_BACKTRACE: ${RUST_BACKTRACE}"
echo "*************************************"
''']

[tasks.print-ci-env]
private = true
condition = { env = { "CARGO_MAKE_CI" = "true" } }
script = ['''
#!@duckscript
echo "*************************************"
echo "CI:"
echo "    CI: ${CARGO_MAKE_CI}"
echo "    PR: ${CARGO_MAKE_PR}"
echo "    Branch Name: ${CARGO_MAKE_CI_BRANCH_NAME}"
echo "    CI Vendor: ${CARGO_MAKE_CI_VENDOR}"
echo "*************************************"
''']

[tasks.print-rust-env]
category = "Tools"
condition = { env_set = ["CARGO_MAKE_RUST_CHANNEL"] }
script = ['''
#!@duckscript
output = exec --fail-on-error rustc "--version"
assert_eq ${output.code} 0
rustc_version_parts = split ${output.stdout} " "
hash_raw = array_get ${rustc_version_parts} 2
hash = replace ${hash_raw} "(" ""
date_raw = array_get ${rustc_version_parts} 3
date = replace ${date_raw} ")\n" ""
release ${rustc_version_parts}


echo "*************************************"
echo "Rust:"
echo "    Version: ${CARGO_MAKE_RUST_VERSION}"
echo "    Toolchain: ${CARGO_MAKE_RUSTUP_TOOLCHAIN_NAME}"
echo "    Channel: ${CARGO_MAKE_RUST_CHANNEL}"
echo "    Build Hash: ${hash}"
echo "    Build Date: ${date}"
echo "    Target Arch: ${CARGO_MAKE_RUST_TARGET_ARCH}"
echo "    Target Env: ${CARGO_MAKE_RUST_TARGET_ENV}"
echo "    Target OS: ${CARGO_MAKE_RUST_TARGET_OS}"
echo "    Pointer Width: ${CARGO_MAKE_RUST_TARGET_POINTER_WIDTH}"
echo "    Target Triple: ${CARGO_MAKE_RUST_TARGET_TRIPLE}"
echo "*************************************"
''']

[tasks.print-cargo-env]
category = "Tools"
condition = { env_set = ["CARGO_MAKE_CARGO_HOME"] }
script = ['''
#!@duckscript
echo "*************************************"
echo "Cargo:"
echo "    Home: ${CARGO_MAKE_CARGO_HOME}"
echo "    Profile: ${CARGO_MAKE_CARGO_PROFILE}"
echo "*************************************"
''']

[tasks.format]
category = "Development"
dependencies = ["format-rust"]

[tasks.check-format]
description = "Runs cargo fmt to check appropriate code format."
category = "Test"
command = "cargo"
args = ["fmt", "--", "--check"]
dependencies = ["install-rustfmt"]

[tasks.format-rust]
category = "Development"
description = "Formats source code (Rust)"
command = "cargo"
args = ["fmt"]
dependencies = ["install-rustfmt"]

[tasks.install-rustfmt]
category = "Development"
description = "Installs cargo rustfmt plugin."
env.CFG_RELEASE = { value = "${CARGO_MAKE_RUST_VERSION}", condition = { env_not_set = [
    "CFG_RELEASE",
] } }
env.CFG_RELEASE_CHANNEL = { value = "${CARGO_MAKE_RUST_CHANNEL}", condition = { env_not_set = [
    "CFG_RELEASE_CHANNEL",
] } }
install_crate = { crate_name = "rustfmt-nightly", rustup_component_name = "rustfmt", binary = "rustfmt", test_arg = "--help" }

[tasks.bloat]
category = "Development"
description = "Run cargo-bloat"
command = "cargo"
args = ["bloat", "${@}"]

[tasks.runic]
category = "Build"
description = "Builds runic and installs it to the bin folder"
command = "cargo"
args = [
    "-Z",
    "unstable-options",
    "build",
    "-p",
    "runic",
    "--artifact-dir",
    "${RUNIC_BIN_DIR}",
]

[tasks.runic-opt]
category = "Build"
description = "Builds runic-opt and installs it to the bin folder"
command = "cargo"
args = [
    "-Z",
    "unstable-options",
    "build",
    "-p",
    "runic-opt",
    "--artifact-dir",
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/bin",
]

[tasks.build]
category = "Build"
description = "Runs cargo build on the workspace"
run_task = [{ name = ["runic", "runic-opt"] }]

[tasks.install]
category = "Install"
description = "Installs the compiler via cargo"
run_task = [
    { name = [
       "install-runic",
       "install-runic-opt",
    ] },
]

[tasks.check]
category = "Build"
description = "Runs cargo check on the workspace"
command = "cargo"
args = ["check", "${@}"]

[tasks.check-each]
category = "Build"
description = "Runs cargo check on each member of the workspace independently"
# `skip_crate_env_info` (see `[config]`) also empties the member list a `workspace = true` task
# iterates, so the loop is here: one `cargo check -p <member>` per member, with the task's
# arguments. Selecting one package resolves features for that package alone, as running in its
# directory did, so feature unification across members cannot hide an error.
script_runner = "bash"
script = ['''
set -euo pipefail
members=$(cargo metadata --no-deps --format-version 1 |
    python3 -c 'import json, sys; print(" ".join(p["name"] for p in json.load(sys.stdin)["packages"]))')
for member in $members; do
    echo "cargo check -p $member $*"
    cargo check -p "$member" "$@"
done
''']

[tasks.clean]
category = "Build"
description = "Clean build artifacts"
command = "cargo"
args = ["clean", "${@}"]

[tasks.sweep]
category = "Build"
description = "Garbage-collect the target directory: mark the live units by replaying the workspace build/test graphs, keep unmarked units younger than --age days (default 1; --cache-age 14 for directories the marks never reach), delete the rest; pass --dry-run to only report"
command = "python3"
args = [
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools/sweep-target.py",
    "${CARGO_TARGET_DIR}",
    "${@}",
]

[tasks.sweep-deep]
category = "Build"
description = "Garbage-collect the target directory with no age guards: keep only the units the workspace build/test graphs mark live. Run after switching branch bases (a rebase orphans a whole build generation at once). Deletes IDE/clippy checker layers and the nested build caches; the next test run rebuilds them"
command = "python3"
args = [
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools/sweep-target.py",
    "${CARGO_TARGET_DIR}",
    "--age",
    "0",
    "--cache-age",
    "0",
    "${@}",
]

# Runs at the end of `cargo make test-all`, the one flow after which the mark
# step compiles nothing (the whole graph was just built). Skips any directory a
# running build holds locked, and a failure (for example, no `python3` on the
# machine) never fails the flow. Set `RUNIC_SKIP_SWEEP` to disable it, for
# example when alternating between branches that supersede each other's builds.
[tasks.sweep-flow]
private = true
ignore_errors = true
condition = { env_not_set = ["RUNIC_SKIP_SWEEP"] }
command = "python3"
args = [
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools/sweep-target.py",
    "${CARGO_TARGET_DIR}",
]

[tasks.test-sweep]
category = "Test"
description = "Run target-sweeper unit tests"
command = "python3"
args = [
    "-m",
    "unittest",
    "discover",
    "-s",
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools",
    "-p",
    "test_sweep_target.py",
]

[tasks.test-coverage-script]
category = "Test"
description = "Run unit tests for the coverage collection script"
command = "python3"
args = [
    "-m",
    "unittest",
    "discover",
    "-s",
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools",
    "-p",
    "test_coverage.py",
]

[tasks.update]
category = "Dependencies"
description = "Update dependencies to latest semver-compatible version"
command = "cargo"
args = ["update"]

[tasks.refresh-example-lockfiles]
category = "Dependencies"
description = "Refresh checked-in example and fixture lockfiles without compiling crates"
script = ['''
#!/usr/bin/env bash
set -euo pipefail

WORKSPACE="${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
refreshed=0

while IFS= read -r -d '' lockfile; do
    manifest="${WORKSPACE}/${lockfile%/Cargo.lock}/Cargo.toml"
    if [[ ! -f "${manifest}" ]]; then
        echo "missing manifest for ${lockfile}: ${manifest}" >&2
        exit 1
    fi

    echo "Refreshing ${lockfile}"
    cargo update --workspace --manifest-path "${manifest}"
    refreshed=$((refreshed + 1))
done < <(git -C "${WORKSPACE}" ls-files -z -- \
    'examples/**/Cargo.lock' \
    'tests/fixtures/**/Cargo.lock')

if [[ "${refreshed}" -eq 0 ]]; then
    echo "no checked-in example or fixture lockfiles found" >&2
    exit 0
fi

echo "Refreshed ${refreshed} lockfiles"
''']

[tasks.outdated]
category = "Dependencies"
description = "Look for dependencies with newer, possibly-incompatible versions"
command = "cargo"
args = ["outdated", "--workspace", "--root-deps-only"]

[tasks.check-deps]
category = "Dependencies"
description = "Check dependencies for lack of use, duplicates, vulnerabilities, etc."
run_task = [
    { name = [
        "unused",
        "duplicates",
        "audit",
    ] },
]

[tasks.unused]
category = "Dependencies"
description = "Check for unused dependencies"
command = "cargo"
args = ["shear"]

[tasks.duplicates]
category = "Dependencies"
description = "Check dependencies for multiple versions of the same crate"
command = "cargo"
args = ["tree", "--duplicate"]

[tasks.audit]
category = "Dependencies"
description = "Check dependencies for known vulnerabilities, deprecations"
command = "cargo"
args = ["audit"]

[tasks.test-all]
category = "Test"
description = "Runs the complete set of compiler tests"
run_task = { name = ["test-sweep", "test-coverage-script", "test-rust", "test-lit"], fork = true, cleanup_task = "sweep-flow" }

[tasks.test]
category = "Test"
description = "Runs all Rust-based tests including network integration tests"
dependencies = ["test-sweep", "test-coverage-script", "test-rust"]

[tasks.test-release]
category = "Test"
description = "Runs Rust-based tests via the workspace-wide test-release profile"
dependencies = ["test-release-rust"]

[tasks.install-runic]
category = "Install"
description = "Builds runic and installs it globally via the cargo bin directory"
command = "cargo"
args = [
    "install",
    "--locked",
    "--path",
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/runic",
    "--${RUNIC_BUILD_PROFILE}",
    "--force",
    "--bin",
    "runic",
]

[tasks.install-runic-opt]
category = "Install"
description = "Builds runic-opt and installs it globally via the cargo bin directory"
command = "cargo"
args = [
    "install",
    "--locked",
    "--path",
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools/runic-opt",
    "--${RUNIC_BUILD_PROFILE}",
    "--force",
    "--bin",
    "runic-opt",
]

[tasks.test-rust]
category = "Test"
description = "Run tests written in Rust, with optional extra arguments"
command = "cargo"
install_crate_args = ["--locked"]
args = [
    "nextest",
    "run",
    "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
    "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
    "${@}",
]
dependencies = ["install-nextest"]

[tasks.test-release-rust]
category = "Test"
description = "Run tests written in Rust via the workspace-wide test-release profile"
command = "cargo"
install_crate_args = ["--locked"]
args = [
    "nextest",
    "run",
    "--cargo-profile",
    "test-release",
    "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
    "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
    "${@}",
]
dependencies = ["install-nextest"]

[tasks.test-lit]
category = "Test"
description = "Builds runic-opt into bin and runs the lit suite of tests/lit"
command = "litcheck"
args = [
    "lit",
    "run",
    "--verbose",
    "--path",
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/bin",
    "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tests/lit",
]
dependencies = ["litcheck", "runic-opt"]

[tasks.lit]
category = "Test"
description = "Builds runic-opt into bin and runs `litcheck lit` with the arguments given"
command = "litcheck"
args = [
    "lit",
    "${@}",
]
dependencies = ["litcheck", "runic-opt"]

[tasks.lit-coverage]
category = "Test"
description = "Builds runic-opt into bin and lists the operations that no test of tests/lit/parse names, and the passes that no RUN line of tests/lit names"
command = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tests/lit/coverage.sh"
args = ["${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/bin/runic-opt"]
dependencies = ["runic-opt"]

[tasks.litcheck]
category = "Test"
description = "Set up the litcheck utility"
# The version the lit suite (tests/lit) is written for.
install_crate = { crate_name = "litcheck", binary = "litcheck", min_version = "0.5.0", test_arg = "--help" }

[tasks.docs]
category = "Documentation"
command = "cargo"
args = ["doc"]

[tasks.clippy]
description = "Runs clippy on the workspace"
category = "Development"
command = "cargo"
args = [
    "clippy",
    "--all",
    "--all-targets",
    "${@}",
    "--",
    "-D",
    "clippy::all",
    "-D",
    "warnings",
]

[tasks.publish-dry-run]
category = "Test"
description = "Simulate publishing to uncover any build errors when each crate folder is built in isolation"
command = "cargo"
args = [
    "publish",
    "--dry-run",
]

[tasks.install-cargo-llvm-cov]
private = true
install_crate = { crate_name = "cargo-llvm-cov", min_version = "0.9.1", binary = "cargo", test_arg = [
    "llvm-cov",
    "--version",
] }

[tasks.coverage]
category = "Test"
description = "Run Rust and lit tests and collect combined coverage in rust-coverage.xml"
dependencies = ["install-cargo-llvm-cov", "litcheck", "install-llvm-tools", "install-nextest"]
command = "python3"
args = ["${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/tools/coverage.py", "${@}"]

[tasks.install-llvm-tools]
private = true
category = "Tools"
description = "Install LLVM tools for the active Rust toolchain"
command = "rustup"
args = ["component", "add", "llvm-tools-preview"]

[tasks.install-nextest]
private = true
category = "Tools"
description = "Install cargo-nextest if it is unavailable"
install_crate = { crate_name = "cargo-nextest", binary = "cargo-nextest", test_arg = "--version" }
install_crate_args = ["--locked"]

# Release tooling
# ============================================================
# Local, read-only or repository-local commands only. `publish` and `finalize`
# are deliberately absent: they cross irreversible boundaries and belong to the
# release workflow, where an approval gate and a short-lived token stand between
# them and production. A convenient local shortcut for them would be a way to
# skip that by accident.

[tasks.release]
category = "Release"
description = "Invoke a `release-tool` command"
command = "release-tool"
install_crate = { crate_name = "miden-release-tool", binary = "release-tool", test_arg = "--help" }
install_crate_args = ["--locked"]
args = [
    "${@}"
]
env = { "GITHUB_REPOSITORY" = "bitwalker/runic" }
