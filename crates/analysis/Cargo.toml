[package]
name = "runic-analysis"
description = "Runic's data-flow analysis framework and passes"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
blink-alloc.workspace = true
bitvec.workspace = true
log.workspace = true
runic-ir.workspace = true

[dev-dependencies]
# Use local paths for dev-only dependency to avoid relying on crates.io during packaging
runic-dialect-arith = { path = "../dialects/arith" }
runic-dialect-cf = { path = "../dialects/cf" }
runic-dialect-scf = { path = "../dialects/scf" }
runic-ir = { path = "../ir", features = ["logging"] }
