[package]
name = "runic-transform"
description = "Transformation passes and utilities for Runic IR"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
log.workspace = true
runic-ir.workspace = true
runic-analysis.workspace = true

[dev-dependencies]
# NOTE: Use local paths for dev-only dependency to avoid relying on crates.io during packaging
litcheck-filecheck.workspace = true
runic-dialect-arith = { path = "../dialects/arith" }
runic-dialect-cf = { path = "../dialects/cf" }
runic-dialect-mem = { path = "../dialects/mem" }
runic-dialect-scf = { path = "../dialects/scf" }
runic-dialect-ub = { path = "../dialects/ub" }
runic-dialect-wasm = { path = "../dialects/wasm" }
runic-expect-test = { path = "../../tools/expect-test" }
runic-ir = { path = "../ir", features = ["logging"] }
