[package]
name = "runic-dialect-hir"
description = "High-level intrinsics dialect for Runic"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
default = ["std"]
std = ["runic-core/std"]

[dependencies]
log.workspace = true
runic-dialect-arith.workspace = true
runic-dialect-cf.workspace = true
runic-dialect-scf.workspace = true
runic-core.workspace = true
runic-analysis.workspace = true
thiserror.workspace = true

[dev-dependencies]
# NOTE: Use local paths for dev-only dependency to avoid relying on crates.io during packaging
litcheck-filecheck.workspace = true
runic-core = { path = "../../core", features = ["logging"] }
