[package]
name = "runic-dialect-arith"
description = "Arithmetic dialect for Runic"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
default = ["std"]
std = ["runic-core/std"]

[dependencies]
runic-core.workspace = true
paste.workspace = true

[dev-dependencies]
# Use local paths for dev-only dependency to avoid relying on crates.io during packaging
runic-core = { path = "../../core", features = ["logging"] }
runic-dialect-ub = { path = "../ub" }
