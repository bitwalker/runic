[package]
name = "runic-dialect-ub"
description = "Undefined behavior dialect for Runic"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
default = ["std"]
std = ["runic-ir/std"]

[dependencies]
runic-ir.workspace = true

[dev-dependencies]
# Use local paths for dev-only dependency to avoid relying on crates.io during packaging
runic-ir = { path = "../../ir", features = ["logging"] }
