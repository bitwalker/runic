[package]
name = "runic-compile"
description = "The compiler harness of Runic: what a compilation is asked to do, and the stages it runs through"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# The toy language and the two toy machines in `runic_compile::testing`, for tests of programs
# built on the harness.
testing = ["dep:runic-dialect-arith"]

[dependencies]
runic-core.workspace = true
runic-transform.workspace = true
runic-dialect-arith = { workspace = true, optional = true }

[dev-dependencies]
runic-dialect-arith.workspace = true
# The crate itself with its `testing` feature on, so `cargo test` builds `tests/toy.rs`.
runic-compile = { path = ".", features = ["testing"] }
tempfile.workspace = true

[[test]]
name = "toy"
required-features = ["testing"]
