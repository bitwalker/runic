[package]
name = "runic-diagnostics"
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std", "derive"]
std = ["annotate-snippets/std", "serde/std"]
arbitrary = ["std", "dep:proptest"]
derive = ["dep:runic-diagnostics-macros"]
simd = ["annotate-snippets/simd"]
embed-explanations = []
linked-registry = ["std", "dep:inventory"]
zerocopy = ["dep:zerocopy"]
serde = ["dep:serde"]

[dependencies]
annotate-snippets.workspace = true
inventory = { workspace = true, optional = true }
runic-diagnostics-macros = { workspace = true, optional = true }
paste.workspace = true
proptest = { workspace = true, optional = true }
zerocopy = { version = "0.8", optional = true, default-features = false, features = ["derive"] }
serde = { workspace = true, optional = true, default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
annotate-snippets = { workspace = true, features = ["testing-colors"] }
wasmi = { workspace = true, features = ["std"] }

[[test]]
name = "derive"
path = "tests/derive.rs"
required-features = ["derive"]

[[test]]
name = "derive_compile"
path = "tests/derive_compile.rs"
required-features = ["derive"]

[[test]]
name = "std_subprocess"
path = "tests/std_subprocess.rs"
required-features = ["std"]

[[test]]
name = "registry_external"
path = "tests/registry_external.rs"
required-features = ["std"]

[[test]]
name = "arithmetic_example"
path = "tests/arithmetic_example.rs"
required-features = ["std", "derive"]

[[example]]
name = "arithmetic"
path = "examples/arithmetic/main.rs"
required-features = ["std", "derive"]
