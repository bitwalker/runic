[package]
name = "runic-opt"
description = "Reads textual IR, runs a pass pipeline on it, verifies and prints the result"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[[bin]]
name = "runic-opt"
path = "src/main.rs"

[dependencies]
clap.workspace = true
log.workspace = true
# The version and features `runic-log` uses, with Unicode classes for `expected-<kind>-re`.
regex = { version = "1.0", default-features = false, features = ["std", "perf", "unicode"] }
runic-analysis.workspace = true
runic-core.workspace = true
runic-dialect-arith.workspace = true
runic-dialect-cf.workspace = true
runic-dialect-mem.workspace = true
runic-dialect-scf.workspace = true
runic-dialect-ub.workspace = true
runic-log.workspace = true
runic-transform.workspace = true

[dev-dependencies]
tempfile.workspace = true
