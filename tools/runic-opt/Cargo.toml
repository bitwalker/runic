[package]
name = "runic-opt"
description = "Reads textual IR, runs a pass pipeline on it, verifies and prints the result"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[features]
# The toy language `calc` and the toy machines `stackvm` and `altvm` among the stages the tool
# registers: stages to run the harness path against, for the tests and the lit suite.
toy = ["runic-compile/testing"]

[lib]
doctest = false

[[bin]]
name = "runic-opt"
path = "src/main.rs"

[dependencies]
clap.workspace = true
log.workspace = true
# With Unicode classes for `expected-<kind>-re`.
regex = { workspace = true, features = ["unicode"] }
runic-analysis.workspace = true
runic-compile.workspace = true
runic-driver.workspace = true
runic-ir.workspace = true
runic-dialect-arith.workspace = true
runic-dialect-cf.workspace = true
runic-dialect-mem.workspace = true
runic-dialect-scf.workspace = true
runic-dialect-ub.workspace = true
runic-log.workspace = true
runic-transform.workspace = true

[dev-dependencies]
# The crate itself with its `toy` feature on, so `cargo test` builds the tests with the toy stages.
runic-opt = { path = ".", features = ["toy"] }
tempfile.workspace = true
